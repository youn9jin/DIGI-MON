server:
  port: 8080

spring:
  application:
    name: digimon-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  # DB 설정은 application-local.yml (로컬 전용, 미커밋) 또는 환경 변수 사용
  datasource:
    url: jdbc:postgresql://localhost:5432/digi-mon
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized
    info:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
