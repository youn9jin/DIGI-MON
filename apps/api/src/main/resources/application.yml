server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: digimon-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  # DB 설정은 application-local.yml (로컬 전용, 미커밋) 또는 환경 변수 사용
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:true}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized
    info:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# AI 마이크로서비스 연동 (내부 전용). application-local.yml에서 오버라이드 가능
digimon:
  ai:
    base-url: ${DIGIMON_AI_BASE_URL:http://localhost:8000}
    timeout-ms: ${DIGIMON_AI_TIMEOUT_MS:3000}
    enabled: ${DIGIMON_AI_ENABLED:false}
    # 시장 페이지 생성(POST /generate) 호출용 응답 타임아웃. 일반 timeout-ms 와 별도.
    market-page-timeout-ms: ${DIGIMON_AI_MARKET_PAGE_TIMEOUT_MS:60000}

# Web/CORS 설정. 운영 도메인은 환경변수 WEB_CORS_ALLOWED_ORIGINS 로 주입 (콤마 구분)
web:
  cors:
    allowed-origins: ${WEB_CORS_ALLOWED_ORIGINS:http://localhost:3000}
