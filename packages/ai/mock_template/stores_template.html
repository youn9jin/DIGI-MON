<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{MARKET_NAME}} - 가게정보</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Black+Han+Sans&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --col-red:    #C8362A;
      --col-yellow: #E8A020;
      --col-green:  #2A6E38;
      --col-blue:   #1A4FA0;
      --col-navy:   #1A2E6E;
      --bg:         #F5F3EE;
      --white:      #FFFFFF;
      --text:       #1A1A1A;
      --text-muted: #888880;
      --border:     #E0DDD6;
    }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
    }
    a { text-decoration: none; color: inherit; }

    /* Pennant */
    .pennant-bar { display: flex; height: 48px; overflow: hidden; background: var(--white); }
    .pennant {
      flex: 1;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      animation: pennantSwing 0.5s ease-out both;
    }
    .pennant:nth-child(5n+1) { background: var(--col-red); }
    .pennant:nth-child(5n+2) { background: var(--col-yellow); }
    .pennant:nth-child(5n+3) { background: var(--col-green); }
    .pennant:nth-child(5n+4) { background: var(--col-blue); }
    .pennant:nth-child(5n+5) { background: var(--col-navy); }
    .pennant:nth-child(1)  { animation-delay:0.00s; }
    .pennant:nth-child(2)  { animation-delay:0.04s; }
    .pennant:nth-child(3)  { animation-delay:0.08s; }
    .pennant:nth-child(4)  { animation-delay:0.12s; }
    .pennant:nth-child(5)  { animation-delay:0.16s; }
    .pennant:nth-child(6)  { animation-delay:0.20s; }
    .pennant:nth-child(7)  { animation-delay:0.24s; }
    .pennant:nth-child(8)  { animation-delay:0.28s; }
    .pennant:nth-child(9)  { animation-delay:0.32s; }
    .pennant:nth-child(10) { animation-delay:0.36s; }
    .pennant:nth-child(11) { animation-delay:0.40s; }
    .pennant:nth-child(12) { animation-delay:0.44s; }
    .pennant:nth-child(13) { animation-delay:0.48s; }
    .pennant:nth-child(14) { animation-delay:0.52s; }
    .pennant:nth-child(15) { animation-delay:0.56s; }
    .pennant:nth-child(16) { animation-delay:0.60s; }
    .pennant:nth-child(17) { animation-delay:0.64s; }
    .pennant:nth-child(18) { animation-delay:0.68s; }
    .pennant:nth-child(19) { animation-delay:0.72s; }
    .pennant:nth-child(20) { animation-delay:0.76s; }
    @keyframes pennantSwing {
      from { transform: translateY(-100%) rotate(-5deg); opacity: 0; }
      to   { transform: translateY(0) rotate(0deg); opacity: 1; }
    }

    /* Nav */
    .main-nav {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: flex-end;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 0 24px; height: 44px;
    }
    .nav-tabs { display: flex; gap: 0; margin-right: auto; margin-left: auto; }
    .nav-tab {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 0 20px; height: 44px;
      font-size: 11px; font-weight: 500; color: var(--text-muted);
      border-bottom: 2px solid transparent;
      transition: color .2s, border-color .2s; white-space: nowrap;
    }
    .nav-tab:hover, .nav-tab.active { color: var(--text); border-bottom-color: var(--col-red); }
    .lang-switch {
      display: flex; flex-direction: column; align-items: center;
      font-size: 10px; font-weight: 700; color: var(--text-muted); line-height: 1.3;
      border: 1px solid var(--border); padding: 4px 8px; border-radius: 3px;
    }
    .lang-switch .active { color: var(--col-red); }

    /* Page body */
    .page-wrap { max-width: 960px; margin: 0 auto; padding: 40px 24px 0; }

    /* Hero */
    .stores-hero { display: flex; flex-direction: column; align-items: center; margin-bottom: 36px; }
    .stores-hero-image {
      width: 280px; height: 140px;
      background: #D8D5CE;
      border-radius: 4px; overflow: hidden;
      margin-bottom: 14px;
    }
    .stores-hero-image img { width: 100%; height: 100%; object-fit: cover; }
    .stores-hero p { font-size: 13px; color: var(--text-muted); }
    .stores-hero strong { color: var(--text); }

    /* Category nav */
    .section-label {
      font-family: 'Black Han Sans', sans-serif;
      font-size: 16px;
      letter-spacing: 0.1em;
      text-align: center;
      margin-bottom: 20px;
    }
    .cat-nav { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 18px; }
    .cat-btn {
      padding: 7px 22px;
      border: 1.5px solid #CCC;
      border-radius: 40px;
      background: var(--white);
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 13px;
      cursor: pointer;
      transition: background .2s, border-color .2s, color .2s;
    }
    .cat-btn:hover, .cat-btn.active {
      background: var(--text);
      border-color: var(--text);
      color: var(--white);
    }

    /* Search */
    .search-wrap {
      display: flex; align-items: center;
      border: 1.5px solid #CCC;
      border-radius: 40px;
      padding: 8px 18px;
      background: var(--white);
      max-width: 380px;
      margin: 0 auto 32px;
      gap: 8px;
    }
    .search-wrap input {
      border: none; outline: none;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 13px; width: 100%;
    }
    .search-icon { font-size: 14px; color: var(--text-muted); }

    /* Store grid */
    .stores-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 60px;
    }
    .store-card {
      background: var(--white);
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--border);
      transition: transform .2s, box-shadow .2s;
      display: block;
    }
    .store-card:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,0.1); }
    .store-thumb {
      width: 100%; height: 96px;
      background: #E0DDD6;
      overflow: hidden;
    }
    .store-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .store-card-info { padding: 10px 12px 13px; }
    .store-cat-label { font-size: 11px; color: var(--text-muted); margin-bottom: 3px; }
    .store-card-name { font-size: 13px; font-weight: 700; }

    /* Empty state */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 48px;
      color: var(--text-muted);
      font-size: 13px;
    }

    /* Footer */
    .site-footer {
      background: #ECEAE3;
      padding: 32px 32px 40px;
      border-top: 1px solid var(--border);
    }
    .footer-nav { display: flex; gap: 28px; margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
    .footer-nav a { font-size: 12px; color: var(--text-muted); transition: color .2s; }
    .footer-nav a:hover { color: var(--text); }
    .footer-cols { display: flex; gap: 64px; }
    .footer-col strong { display: block; font-size: 12px; font-weight: 700; margin-bottom: 8px; }
    .footer-col p { font-size: 12px; color: var(--text-muted); line-height: 1.8; }
  </style>
</head>
<body>

  <!-- 페넌트 -->
  <div class="pennant-bar">
    <div class="pennant"></div><div class="pennant"></div><div class="pennant"></div>
    <div class="pennant"></div><div class="pennant"></div><div class="pennant"></div>
    <div class="pennant"></div><div class="pennant"></div><div class="pennant"></div>
    <div class="pennant"></div><div class="pennant"></div><div class="pennant"></div>
    <div class="pennant"></div><div class="pennant"></div><div class="pennant"></div>
    <div class="pennant"></div><div class="pennant"></div><div class="pennant"></div>
    <div class="pennant"></div><div class="pennant"></div>
  </div>

  <!-- 내비게이션 -->
  <nav class="main-nav">
    <div class="nav-tabs">
      <a class="nav-tab" href="index.html">시장<br>소개</a>
      <a class="nav-tab active" href="stores.html">가게<br>정보</a>
      <a class="nav-tab" href="tourism.html">관광<br>정보</a>
    </div>
    <div class="lang-switch">
      <span>EN</span>
      <span class="active">KR</span>
    </div>
  </nav>

  <div class="page-wrap">

    <!-- 히어로 -->
    <div class="stores-hero">
      <div class="stores-hero-image">
        <img src="{{MARKET_IMAGE_SRC}}" alt="{{MARKET_NAME}}" onerror="this.style.display='none'" />
      </div>
      <p>우리 시장에서는 <strong>{{STORE_COUNT}}개</strong>의 다양한 가게들을 만나볼 수 있습니다!</p>
    </div>

    <!-- 카테고리 필터 -->
    <div class="section-label">CATEGORY</div>
    <div class="cat-nav">
      <button class="cat-btn active" data-cat="all">전체</button>
      {{CATEGORY_BUTTONS}}
    </div>

    <!-- 검색 -->
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="원하는 매장을 검색해보세요" />
    </div>

    <!-- 가게 그리드 -->
    <div class="stores-grid" id="storesGrid">
      {{STORE_CARDS_HTML}}
    </div>
  </div>

  <!-- 푸터 -->
  <footer class="site-footer">
    <div class="footer-nav">
      <a href="index.html">시장소개</a>
      <a href="stores.html">가게안내</a>
      <a href="tourism.html">관광정보</a>
      <a href="#">찾아오는 길</a>
    </div>
    <div class="footer-cols">
      <div class="footer-col">
        <strong>주소</strong>
        <p>{{MARKET_ADDRESS}}</p>
      </div>
      <div class="footer-col">
        <strong>문의</strong>
        <p>TEL : {{MARKET_PHONE}}</p>
        <p>FAX : {{MARKET_FAX}}</p>
      </div>
      <div class="footer-col">
        <strong>이메일</strong>
        {{MARKET_EMAILS_HTML}}
      </div>
    </div>
  </footer>

  <script>
    const cards = Array.from(document.querySelectorAll('.store-card'));
    const searchInput = document.getElementById('searchInput');
    const catBtns = document.querySelectorAll('.cat-btn');
    let currentCat = 'all';

    function applyFilter() {
      const q = searchInput.value.trim().toLowerCase();
      cards.forEach(card => {
        const cat  = card.dataset.category || '';
        const name = (card.querySelector('.store-card-name') || {}).textContent || '';
        const matchCat  = currentCat === 'all' || cat === currentCat;
        const matchName = !q || name.toLowerCase().includes(q);
        card.style.display = (matchCat && matchName) ? '' : 'none';
      });
    }

    catBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        catBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCat = btn.dataset.cat;
        applyFilter();
      });
    });
    searchInput.addEventListener('input', applyFilter);
  </script>
</body>
</html>
